name: Build

on:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release Drafter"]
    types: [completed]

# The called workflow's draft-release jobs (read draft info, upload assets,
# strip the pending warning) need contents: write; they only run on
# workflow_run events. Fork pull requests still get a read-only token.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && 'release-drafter' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build to Draft Release
    # Builds the factory configs and — when triggered by a successful Release
    # Drafter run — uploads the firmware to the current draft release. On
    # pull_request / workflow_dispatch it only builds.
    uses: esphome/workflows/.github/workflows/build-to-draft-release.yml@cc3e76de337dc59bc1cba8da58d963cd23b873f1  # 2026.9.0
    with:
      #### Modify below here to match your project ####
      # Every *.factory.yaml in the repo is discovered automatically; the
      # builds are combined into a single manifest published under this name.
      # Remove combined-name to publish one manifest per file instead.
      combined-name: network-toolbox
      # dev, not a release: the config pins esphome/esphome#18530 (spi_id on
      # ethernet), which is not in a release yet. Pin this back to a version once
      # that lands.
      esphome-version: dev
      #### Modify above here to match your project ####
