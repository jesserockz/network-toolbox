name: Publish Firmware

on:
  release:
    types: [published]

permissions: {}

jobs:
  build-firmware:
    name: Build Firmware
    permissions:
      contents: read  # actions/checkout
    uses: esphome/workflows/.github/workflows/build.yml@0fdd5e311b7e744069166696072a1a9cbc5fbeb6  # 2026.8.1
    with:
      #### Modify below here to match your project ####
      files: |
        project-template-esp32.factory.yaml
        project-template-esp32-c3.factory.yaml
        project-template-esp32-c6.factory.yaml
        project-template-esp32-s3.factory.yaml
      esphome-version: 2026.8.1
      combined-name: project-template
      #### Modify above here to match your project ####

      release-summary: ${{ github.event.release.body }}
      release-url: ${{ github.event.release.html_url }}
      release-version: ${{ github.event.release.tag_name }}

  upload-to-release:
    name: Upload to Release
    permissions:
      contents: write  # upload assets to the release
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@0fdd5e311b7e744069166696072a1a9cbc5fbeb6  # 2026.8.1
    needs:
      - build-firmware
    with:
      version: ${{ github.event.release.tag_name }}
